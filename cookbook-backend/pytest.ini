[pytest]
markers =
    e2e: exercises real Pinecone and the local generation model. Not run by default - use `pytest -m e2e`.
addopts = -m "not e2e"
# Surfaces app/rag.py's per-query retrieval-score logging (best_semantic_score,
# rrf_score, rerank_score) in test output, independent of whether anything in
# the code under test has called logging.basicConfig.
log_cli = true
log_cli_level = INFO
log_level = INFO
